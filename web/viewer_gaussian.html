            if (!splat?.data || !basePositions || !baseScales || splat.data.detached) return false;

            const positions = getSplatPositionArray(splat);
            const scales = splat.data.scales;
            const rotations = splat.data.rotations;
            if (!positions || positions.length !== basePositions.length ||
                !scales || scales.length !== baseScales.length ||
                !rotations || rotations.length !== baseScales.length / 3 * 4 ||
                !depthScaleCameraOrigin) {
                return false;
            }

            const [ox, oy, oz] = depthScaleCameraOrigin;
            // Invert the UI value to adjust perceived depth.
            // The neutral value 1.0 remains unchanged.
            const depthFactor = 1.0 / Math.max(0.1, currentDepthScale);
            const scaleFactor = currentScale;

            for (let i = 0, gaussian = 0; i < positions.length; i += 3, gaussian++) {
                const x = basePositions[i] - ox;
                const y = basePositions[i + 1] - oy;
                const z = basePositions[i + 2] - oz;
                positions[i] = ox + x * depthFactor;
                positions[i + 1] = oy + y * depthFactor;
                positions[i + 2] = oz + z * depthFactor;

                transformGaussianCovariance(
                    baseScales, baseRotations, gaussian, null,
                    depthFactor, scaleFactor, scales, rotations
                );
            }

            splat.data.changed = true;
            if (renderData?.markDirty) {
                renderData.markDirty(splat);
            } else if (splat.dispatchEvent && splat._changeEvent) {
                splat.dispatchEvent(splat._changeEvent);
            }
            return true;
        }

        function applyPendingSplatAdjustments() {
            if (pendingLeftAdjustment && currentSplat) {
                pendingLeftAdjustment = !applyAdjustmentToSplat(
                    currentSplat, originalPositions, originalScales, originalRotations,
                    renderer?._renderData || renderer?.renderData
                );
            }
            if (pendingRightAdjustment && currentSplatRight) {
                pendingRightAdjustment = !applyAdjustmentToSplat(
                    currentSplatRight, originalPositionsRight, originalScalesRight, originalRotationsRight,
                    rendererRight?._renderData || rendererRight?.renderData
                );
            }
        }

        function updateGaussianScale(newScale) {
            newScale = Math.max(0.01, Math.min(100, parseFloat(newScale) || 1.0));
            currentScale = newScale;
            scaleInput.value = newScale;

            if (!currentSplat || !currentSplatRight || !originalScales || !originalScalesRight) {
                console.warn('[GaussianViewer] Scale update skipped: both eye datasets are not ready');
                return;
            }

            pendingLeftAdjustment = true;
            pendingRightAdjustment = true;
            applyPendingSplatAdjustments();
        }

        function scheduleDepthScaleAdjustment() {
            if (depthScaleDebounceTimer !== null) {
                clearTimeout(depthScaleDebounceTimer);
            }

            // Rebuild the Gaussian transforms only after the user pauses input.
            // 100 ms avoids recalculating on every slider step while keeping the control responsive.
            depthScaleDebounceTimer = setTimeout(() => {
                depthScaleDebounceTimer = null;
                if (!currentSplat || !currentSplatRight || !originalPositions || !originalPositionsRight ||
                    !depthScaleCameraOrigin) {
                    console.warn('[GaussianViewer] Perceived Depth Scale: scene geometry or camera pivot is not ready');
                    return;
                }

                pendingLeftAdjustment = true;
                pendingRightAdjustment = true;
                applyPendingSplatAdjustments();
            }, 100);
        }

        function updateDepthScale(value) {
            const parsed = Number.parseFloat(value);
            currentDepthScale = Math.max(0.1, Math.min(3.0, Number.isFinite(parsed) ? parsed : 1.0));
            depthScaleInput.value = currentDepthScale;
            depthScaleValue.textContent = currentDepthScale.toFixed(2) + '×';
            scheduleDepthScaleAdjustment();
        }

        depthScaleInput.addEventListener('input', (e) => updateDepthScale(e.target.value));
        document.getElementById('resetDepthScale').addEventListener('click', () => {
            updateDepthScale(1.0);
        });
        scaleInput.addEventListener('change', (e) => updateGaussianScale(e.target.value));

        // Event listeners
        document.getElementById('resetCamera').addEventListener('click', resetCamera);
        document.getElementById('screenshot').addEventListener('click', takeScreenshot);
        document.getElementById('copyImage').addEventListener('click', copyImageToClipboard);
        stereoSlider.addEventListener('input', () => syncStereoCameras());
        stereoMode.addEventListener('change', () => syncStereoCameras());
        viewMode.addEventListener('change', updateViewMode);
        updateViewMode();

        // PLY parsing is not the same as GPU readiness: wait for both gsplat
        // packing/sorting workers to return indices before capturing the canvases.
        let batchBusy = false;
        function configureBatchStereo(stereo) {
            batchStereo = stereo || null;
            const fixed = batchStereo?.mode === 'fixed';
            const status = document.getElementById('batchPresetStatus');
            status.style.display = 'flex';
            status.textContent = !batchStereo ? 'Viewer controls' : fixed
                ? `${batchStereo.projection} | ${(batchStereo.baseline_m * 1000).toFixed(1)} mm | Convergence: ${batchStereo.convergence_m || 'infinity'}${batchStereo.convergence_m ? ' m' : ''}`
                : `${batchStereo.projection} | ${batchStereo.intensity}%`;
            // The batch node's editable widgets are authoritative; do not let
            // transient iframe controls override queued workflow settings.
            for (const input of [stereoSlider, stereoMode, viewMode, depthScaleInput, scaleInput, document.getElementById('resetDepthScale')]) {
                input.disabled = !!batchStereo;
            }
            if (batchStereo) {
                stereoMode.value = batchStereo.projection.endsWith('Toe-in') ? 'toe-in' : 'parallel';
                stereoSlider.value = batchStereo.intensity;
            }
        }
        function applyBatchGeometrySettings() {
            if (!batchStereo) return;
            currentDepthScale = batchStereo.depth_scale;
            currentScale = batchStereo.splat_scale;
            depthScaleInput.value = currentDepthScale;
            depthScaleValue.textContent = currentDepthScale.toFixed(2) + '×';
            scaleInput.value = currentScale;
            if (currentDepthScale !== 1 || currentScale !== 1) {
                pendingLeftAdjustment = pendingRightAdjustment = true;
                applyPendingSplatAdjustments();
            }
        }
        async function captureBatchFrame(job) {
            let result;
            const reply = (data) => {
                result = data;
                if (!isSharedWorker) window.parent.postMessage({type:'BATCH_FRAME_CAPTURED', id:job.id, ...data}, location.origin);
            };
            if (batchBusy) { reply({error:'Viewer is already rendering another frame'}); return result; }
            batchBusy = true;
            const deadline = performance.now() + Math.max(1000, (job.timeout - 3) * 1000);
            try {
                if (!renderer || !rendererRight) throw new Error('WebGL viewer is not initialized');
                configureBatchStereo(job.stereo);
                // Do not allow orbit or adjustment gestures during capture.
                viewerContainer.style.pointerEvents = 'none';
                document.getElementById('controlsBar').style.pointerEvents = 'none';
                const fastNeutral = !!(isSharedWorker && job.browser_fast && job.stereo?.depth_scale === 1 && job.stereo?.splat_scale === 1 && typeof SPLAT.PLYLoader.LoadSharpBatchPairAsync === 'function');
                renderer._sharpReuseSize = rendererRight._sharpReuseSize = fastNeutral;
                viewMode.checked = true;
                updateViewMode();
                smoothedStereoIntensity = Number(stereoSlider.value) || 0;
                const tLoad = performance.now();
                const loadDetail = {};
                await loadPLYFromURL(job.url, job.filename, job.extrinsics, job.intrinsics, true, loadDetail, fastNeutral);
                const tReady = performance.now();
                // Loading resets the multipliers: reapply immediately, every frame.
                applyBatchGeometrySettings();
                const ready = (r) => {
                    const p = r.renderProgram;
                    const d = p?.renderData;
                    return d && d.vertexCount > 0 && !d.updating && !d.needsRebuild &&
                        !d.dataChanged && p.depthIndex?.length === d.vertexCount;
                };
                // Wake when packing/sorting actually finishes. The timer is
                // only a watchdog for unexpected lost messages/context loss.
                while (true) {
                    if (performance.now() >= deadline) throw new Error('Timed out waiting for both Gaussian sorting workers');
                    if (renderer.gl.isContextLost() || rendererRight.gl.isContextLost()) throw new Error('WebGL context lost');
                    let wake, timer;
                    const event = new Promise(resolve => { wake = resolve; });
                    window.addEventListener('sharp-render-progress', wake);
                    try {
                        renderStereoNow();
                        if (!pendingLeftAdjustment && !pendingRightAdjustment && ready(renderer) && ready(rendererRight)) break;
                        timer = setTimeout(wake, 1000);
                        await event;
                    } finally {
                        clearTimeout(timer);
                        window.removeEventListener('sharp-render-progress', wake);
                    }
                }
                // Draw with the now-current focal uniforms and sorted indices.
                const tCompose = performance.now();
                renderStereoNow();
                const finalCanvas = composeStereoCanvas();
                const tPixels = performance.now();
                const timings = {...loadDetail, load:(tReady-tLoad)/1000, ready:(tCompose-tReady)/1000,
                                 compose:(tPixels-tCompose)/1000, pixels:0};
                if (isSharedWorker) {
                    // The same composited canvas as the legacy PNG path; keep it
                    // available for fallback without reconstructing or rerendering.
                    reply({canvas:finalCanvas,timings});
                } else {
                    reply({image:finalCanvas.toDataURL('image/png')});
                }
            } catch (err) { reply({error:String(err.message || err)}); }
            finally {
                batchBusy = false;
                if (!isSharedWorker) {
                    viewerContainer.style.pointerEvents = '';
                    document.getElementById('controlsBar').style.pointerEvents = '';
                    if (renderer && rendererRight) {
                        if (animationId) cancelAnimationFrame(animationId);
                        resumeAnimationLoop();
                    }
                }
            }
            return result;
        }

        // Shared workers claim queued frames atomically on the Python server.
        // Each worker processes only one frame at a time, regardless of graph ID.
        function startSharedWorker() {
            const status = document.createElement('div');
            status.style.cssText = 'padding:6px 10px;background:#222;color:#ddd;font:12px sans-serif;flex:none;';
            document.body.prepend(status);
            const setStatus = (text) => { status.textContent = 'SHARP renderer: ' + text; document.title = 'SHARP renderer - ' + text; };
            setStatus('Ready / waiting for frames');
            let stopped = false;
            window.addEventListener('pagehide', () => { stopped = true; });
            window.addEventListener('pageshow', (event) => { if (event.persisted && stopped) { stopped = false; poll(); } });
            async function poll() {
                if (stopped) return;
                try {
                    const endpoint = '/sharp_vr_video_batch/next?worker=1&wait=1' + (SPLAT.PLYLoader.SupportsSharpPacked ? '&packed=1' : '') + (window.parent === window ? '&dedicated=1' : '');
                    const response = await fetch(endpoint, {cache:'no-store'});
                    if (!response.ok) throw new Error('Polling HTTP ' + response.status);
                    const {job} = await response.json();
                    if (job) {
                        setStatus('Rendering frame');
                        let output, done;
                        try {
                            const result = await captureBatchFrame(job);
                            if (result?.error) throw new Error(result.error);
                            const frame = result?.canvas;
                            if (!frame) throw new Error('No rendered canvas returned');
                            const timings = result.timings;
                            const start = performance.now();
                            // Only use raw transfer when the server explicitly advertises
                            // it and the canvas dimensions match the expected frame.
                            if (job.rgba_size?.[0] === frame.width && job.rgba_size?.[1] === frame.height) {
                                try {
                                    const pixels = frame.getContext('2d').getImageData(0,0,frame.width,frame.height);
                                    timings.pixels = (performance.now()-start)/1000;
                                    const raw = await fetch('/sharp_vr_video_batch/rgba/' + encodeURIComponent(job.id), {
                                        method:'POST', headers:{'Content-Type':'application/octet-stream',
                                            'X-Sharp-Timings':JSON.stringify(timings)}, body:pixels.data
                                    });
                                    if (raw.ok || raw.status === 404) done = raw;
                                } catch (err) {
                                    console.warn('[SHARP worker] Raw transfer unavailable; falling back to PNG', err);
                                }
                            }
                            if (!done) {
                                const encodeStart = performance.now();
                                const image = frame.toDataURL('image/png');
                                timings.pixels = (performance.now()-encodeStart)/1000;
                                if (!image.startsWith('data:image/png;base64,')) throw new Error('No PNG returned');
                                output = {png:image.split(',')[1],timings};
                            }
                        } catch (error) { output = {error:String(error.message || error)}; }
                        if (!done) done = await fetch('/sharp_vr_video_batch/complete', {
                            method:'POST', headers:{'Content-Type':'application/json'},
                            body:JSON.stringify({id:job.id,...output})
                        });
                        if (!done.ok && done.status !== 404) throw new Error('Capture upload HTTP ' + done.status);
                        setStatus(output?.error ? 'Frame error: ' + output.error : 'Ready / waiting for frames');
                    }
                } catch (error) {
                    console.error('[SHARP worker]',error);
                    setStatus('Connection error; retrying');
                    if (!stopped) setTimeout(poll, 1000);
                    return;
                }
                // Each HTTP response wakes the renderer without a browser timer.
                if (!stopped) poll();
            }
            poll();
        }

        // Listen for messages from parent
        window.addEventListener('message', (event) => {
            const { type, data, url, filename, extrinsics, intrinsics } = event.data;

            if (type === 'LOAD_MESH_URL' && url) {
                console.log('[GaussianViewer] Received LOAD_MESH_URL:', url);
                loadPLYFromURL(url, filename || 'gaussian.ply', extrinsics, intrinsics);
            } else if (type === 'RENDER_BATCH_FRAME' && isBatchViewer && !isSharedWorker && event.source === window.parent && event.origin === location.origin) {
                captureBatchFrame(event.data);
            } else if (type === 'LOAD_MESH_DATA' && data) {
                console.log('[GaussianViewer] Received LOAD_MESH_DATA, size:', data.byteLength);
                loadPLYFromData(data, filename || 'gaussian.ply', extrinsics, intrinsics);
            }
        });

        // Initialize on load
        initViewer();

        console.log('[GaussianViewer] Ready - waiting for LOAD_MESH message');
    </script>
</body>
</html>
