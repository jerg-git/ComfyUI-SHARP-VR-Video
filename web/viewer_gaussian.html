<!-- Modified Gaussian stereo viewer based on PozzettiAndrea/comfy-3d-viewers; see LICENSES/THIRD_PARTY_NOTICES.md. -->
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHARP VR Video Preview</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #1a1a1a;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100vh;
        }

        #viewerContainer { position: relative; flex: 1 1 auto; min-height: 0; min-width: 0; }
        .stereo-panes {
            width: 100%; height: 100%; display: flex; gap: 1px;
            background: #333; overflow: hidden;
        }
        .stereo-pane {
            position: relative; flex: 1 1 50%; min-width: 0; min-height: 0;
            overflow: hidden; background: var(--viewer-background-color, #000000);
        }
        canvas {
            display: block; position: absolute; left: 50%; top: 50%;
            transform: translate(-50%, -50%);
        }
        .error {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; color: #ff6b6b; padding: 20px; max-width: 80%;
        }
        .error.hidden { display: none; }

        #controlsBar {
            display: flex; flex-direction: column; justify-content: center; align-items: stretch;
            gap: 5px; padding: 7px 10px; border-top: 1px solid #333; flex: 0 0 auto;
            color: #aaa; font-size: 11px; min-width: 0;
        }
        .control-row {
            display: flex; align-items: center; justify-content: center; gap: 12px;
            width: 100%; min-width: 0; min-height: 23px; flex-wrap: nowrap;
        }
        .control-group {
            display: flex; align-items: center; gap: 7px; min-width: 0; max-width: 100%;
            white-space: nowrap;
        }
        .control-group label, .scale-control label { color: #aaa; }
        .view-mode-control, .stereo-mode-control {
            flex: 1 1 50%; justify-content: center;
        }
        .stereo-intensity-control, .depth-control {
            flex: 1 1 auto; justify-content: center;
        }
        .action-control {
            flex: 0 0 auto; width: auto; justify-content: center;
        }
        #advancedSettings {
            display: flex; flex-direction: column; gap: 5px; width: 100%;
            padding-top: 5px; border-top: 1px solid #333;
        }
        #advancedSettingsTitle {
            color: #888; font-size: 10px; letter-spacing: 0.04em;
            text-transform: uppercase; text-align: left;
        }
        .advanced-control-row {
            display: flex; align-items: center; justify-content: center;
            gap: 0; width: 100%; min-width: 0; flex-wrap: nowrap;
        }
        .advanced-half {
            flex: 1 1 33.333%; min-width: 0; justify-content: center;
        }
        .mouse-button-control, .size-control, .background-color-control { min-height: 24px; }
        .depth-control {
            flex: 1 1 100%; justify-content: center; min-width: 0;
        }
        .advanced-depth-row { padding-top: 2px; }
        .depth-control input[type="range"] { width: min(300px, 42vw); }
        .background-color-control {
            flex: 1 1 33.333%; min-width: 0; justify-content: center;
        }
        .background-color-control input[type="color"] {
            width: 30px; height: 22px; padding: 1px; border: 1px solid #555;
            border-radius: 3px; background: #333; cursor: pointer;
        }
        .control-group select {
            background: #333; border: 1px solid #555; color: #ddd;
            padding: 3px 6px; border-radius: 3px; font-size: 11px;
        }
        .control-group input[type="checkbox"] {
            width: 13px; height: 13px; margin: 0; accent-color: #69bde0; cursor: pointer;
        }
        .control-group input[type="range"] {
            width: 300px; min-width: 50px; max-width: 300px;
            flex: 1 1 100px; accent-color: #69bde0;
        }
        #stereoValue, #depthScaleValue {
            min-width: 48px; color: #aaa; font: 10px monospace; text-align: center;
        }
        #depthScaleValue { min-width: 58px; }
        #controlsBar button {
            background: #444; border: none; color: #fff; padding: 4px 10px;
            border-radius: 3px; cursor: pointer; font-size: 11px; white-space: nowrap;
        }
        #controlsBar button:hover { background: #555; }
        .scale-control { display: flex; align-items: center; gap: 6px; min-width: 0; }
        .scale-control label { white-space: nowrap; }
        .scale-control input[type="number"] {
            width: 60px; background: #333; border: 1px solid #555; color: #fff;
            font-size: 11px; padding: 4px 6px; border-radius: 3px;
        }
        #stereoPanes.mono-mode .stereo-pane:first-child { flex: 1 1 100%; }
        #stereoPanes.mono-mode .stereo-pane:last-child { display: none; }

        @media (max-width: 560px) {
            #controlsBar { padding-left: 6px; padding-right: 6px; gap: 4px; }
            .control-row { gap: 6px; }
            .control-group { gap: 4px; }
            .advanced-half { gap: 5px; }
            .advanced-depth-row .depth-control { gap: 6px; }
            .depth-control input[type="range"] { min-width: 36px; width: 42vw; }
            #controlsBar button { padding: 4px 6px; }
        }
    </style>
</head>
<body>
    <div id="viewerContainer">
        <div id="stereoPanes" class="stereo-panes">
            <div id="leftPane" class="stereo-pane">
                <canvas id="canvasLeft"></canvas>
            </div>
            <div id="rightPane" class="stereo-pane">
                <canvas id="canvasRight"></canvas>
            </div>
        </div>

        <div id="error" class="error hidden"></div>

    </div>

    <div id="controlsBar">
        <div id="batchPresetStatus" class="control-row" style="display:none; font-size:11px; color:#ddd; padding:4px 0;"></div>
        <div class="control-row">
            <div class="control-group view-mode-control">
                <label for="viewMode">Enable Stereo Preview</label>
                <input type="checkbox" id="viewMode" checked title="When disabled, show one centered mono view">
            </div>
            <div class="control-group stereo-mode-control">
                <label for="stereoMode">Stereo Mode:</label>
                <select id="stereoMode" title="Parallel: both cameras keep the same viewing direction and shift sideways. Toe-in: cameras rotate inward toward a shared convergence point.">
                    <option value="parallel">Parallel</option>
                    <option value="toe-in" selected>Toe-in</option>
                </select>
            </div>
        </div>

        <div class="control-row">
            <div class="control-group stereo-intensity-control" title="Cross-eyed reverses the stereo baseline; Parallel uses the normal left-right order">
                <span>Cross-eyed</span>
                <input type="range" id="stereoSlider" min="-100" max="100" step="1" value="30">
                <span>Parallel</span>
                <span id="stereoValue">+30%</span>
            </div>
        </div>

        <div class="control-row">
            <div class="control-group action-control">
                <button id="screenshot" title="Save the current view to disk">Save to Disk</button>
                <button id="copyImage" title="Copy the current view to the clipboard">Copy to Clipboard</button>
                <button id="resetCamera" title="Reset camera view">Reset View</button>
            </div>
        </div>

        <div id="advancedSettings">
            <div id="advancedSettingsTitle">Advanced Settings</div>
            <div class="advanced-control-row advanced-top-row">
                <div class="control-group advanced-half mouse-button-control">
                    <label for="swapMouseButtons" title="Swap the actions assigned to the left and right mouse buttons">Swap Mouse Buttons</label>
                    <input type="checkbox" id="swapMouseButtons">
                </div>
                <div class="control-group advanced-half size-control">
                    <div class="scale-control">
                        <label for="gaussianScaleValue" title="Adjusts rendered Gaussian size without changing scene depth or camera position">Splat Size Scale:</label>
                        <input type="number" id="gaussianScaleValue" min="0.01" max="100" step="0.1" value="1.0" title="Gaussian splat size multiplier">
                    </div>
                </div>
                <div class="control-group background-color-control">
                    <label for="backgroundColorInput">Background color:</label>
                    <input type="color" id="backgroundColorInput" value="#000000" title="Choose the background color for transparent areas">
                </div>
            </div>
            <div class="advanced-control-row advanced-depth-row">
                <div class="control-group depth-control" title="Adjust perceived scene depth: values below 1 reduce it; values above 1 increase it">
                    <label for="depthScaleSlider">Perceived Depth Scale:</label>
                    <input type="range" id="depthScaleSlider" min="0.1" max="3" step="0.01" value="1">
                    <span id="depthScaleValue">1.00×</span>
                    <button id="resetDepthScale" title="Reset Perceived Depth Scale to 1.00×">Reset</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Load bundled gsplat.js -->
    <script src="./js/gsplat-bundle.js?v=sharp-batch-fast-18"></script>

    <script type="module">
        // Use the globally exported GSPLAT
        const SPLAT = window.GSPLAT;
        const params = new URLSearchParams(location.search);
        const isBatchViewer = params.get("batch") === "1";
        const isSharedWorker = isBatchViewer && params.get("worker") === "1";
        window.__sharpBatchEventRendering = isBatchViewer;

        // DOM elements
        const canvas = document.getElementById('canvasLeft');
        const canvasRight = document.getElementById('canvasRight');
        const leftPane = document.getElementById('leftPane');
        const rightPane = document.getElementById('rightPane');
        const viewerContainer = document.getElementById('viewerContainer');
        const stereoSlider = document.getElementById('stereoSlider');
        const stereoMode = document.getElementById('stereoMode');
        const stereoValue = document.getElementById('stereoValue');
        const viewMode = document.getElementById('viewMode');
        const stereoPanes = document.getElementById('stereoPanes');
        const errorEl = document.getElementById('error');
        const backgroundColorInput = document.getElementById('backgroundColorInput');
        const DEFAULT_BACKGROUND_COLOR = '#000000';
        const BACKGROUND_COLOR_STORAGE_KEY = 'comfyui-sharp-vr-video.backgroundColor';
        let currentBackgroundColor = DEFAULT_BACKGROUND_COLOR;

        function setBackgroundColor(value, persist = true) {
            const color = /^#[0-9a-f]{6}$/i.test(value) ? value : DEFAULT_BACKGROUND_COLOR;
            currentBackgroundColor = color;
            backgroundColorInput.value = color;
            document.documentElement.style.setProperty('--viewer-background-color', color);
            // gsplat.js assigns its own opaque CSS background to each canvas
            // during renderer construction. Keep the actual canvas transparent
            // to the selected pane color by updating the canvas backgrounds too.
            canvas.style.backgroundColor = color;
            canvasRight.style.backgroundColor = color;

            if (persist) {
                try {
                    localStorage.setItem(BACKGROUND_COLOR_STORAGE_KEY, color);
                } catch (error) {
                    console.warn('[GaussianViewer] Could not save background color:', error);
                }
            }
        }

        function restoreBackgroundColor() {
            try {
                const savedColor = localStorage.getItem(BACKGROUND_COLOR_STORAGE_KEY);
                setBackgroundColor(savedColor || DEFAULT_BACKGROUND_COLOR, false);
            } catch (error) {
                console.warn('[GaussianViewer] Could not restore background color:', error);
                setBackgroundColor(DEFAULT_BACKGROUND_COLOR, false);
            }
        }

        backgroundColorInput.addEventListener('input', (event) => {
            setBackgroundColor(event.target.value);
        });
        restoreBackgroundColor();

        // gsplat.js components
        let scene = null;       // Left-eye scene
        let sceneRight = null;  // Independent right-eye scene/data
        let camera = null;
        let renderer = null;       // Left-eye renderer
        let rendererRight = null;  // Right-eye renderer
        let cameraLeft = null;
        let cameraRight = null;
        let controls = null;       // Shared orbit controller for the center camera
        let resetAnimationId = null;
        // Smooth the stereo baseline response while keeping the slider's exact target value.
        let smoothedStereoIntensity = Number(stereoSlider.value) || 0;
        let lastStereoUpdateTime = 0;
        // Set by the Python batch job, not by mutable viewer controls.
        let batchStereo = null;
        let animationId = null;
        let currentSplat = null;
        let currentSplatRight = null;
        let originalScales = null;  // Left-eye baseline scales
        let originalScalesRight = null;
        let originalPositions = null; // Left-eye baseline Gaussian centers
        let originalPositionsRight = null;
        let originalRotations = null;
        let originalRotationsRight = null;
        let currentDepthScale = 1.0;
        let depthScaleCameraOrigin = null;
        let depthScaleDebounceTimer = null;


        function updateCanvasDisplaySizes() {
            if (!isResolutionLocked) return;

            for (const [eyeCanvas, pane] of [
                    [canvas, leftPane],
                    [canvasRight, rightPane]
            ]) {
                    const imageWidth = eyeCanvas.width;
                    const imageHeight = eyeCanvas.height;

                    if (!imageWidth || !imageHeight) continue;

                    const scale = Math.min(
                    pane.clientWidth / imageWidth,
                    pane.clientHeight / imageHeight
                    );

                    eyeCanvas.style.width = `${imageWidth * scale}px`;
                    eyeCanvas.style.height = `${imageHeight * scale}px`;
            }
        }        


        // Default focal length
        const DEFAULT_FOCAL_LENGTH = 30;

        // gsplat.js maps the left button to pan and the right button to orbit.
        // Remap the event before its OrbitControls listener to provide the
        // intended defaults: left = orbit, right = pan. The checkbox reverses it.
        const swapMouseButtonsInput = document.getElementById('swapMouseButtons');
        let swapMouseButtons = false;
        let remappingMouseEvent = false;
        viewerContainer.addEventListener('mousedown', (event) => {
            if (remappingMouseEvent || (event.button !== 0 && event.button !== 2)) return;

            event.preventDefault();
            event.stopImmediatePropagation();
            const mappedButton = event.button === 0
                ? (swapMouseButtons ? 0 : 2)
                : (swapMouseButtons ? 2 : 0);
            const remapped = new MouseEvent('mousedown', {
                bubbles: true,
                cancelable: true,
                view: window,
                button: mappedButton,
                buttons: event.buttons,
                clientX: event.clientX,
                clientY: event.clientY,
                screenX: event.screenX,
                screenY: event.screenY,
                ctrlKey: event.ctrlKey,
                shiftKey: event.shiftKey,
                altKey: event.altKey,
                metaKey: event.metaKey,
            });
            remappingMouseEvent = true;
            event.target.dispatchEvent(remapped);
            remappingMouseEvent = false;
        }, true);
        swapMouseButtonsInput.addEventListener('change', (event) => {
            swapMouseButtons = event.target.checked;
        });

        // Initialize the viewer
        function initViewer() {
            try {
                scene = new SPLAT.Scene();
                sceneRight = new SPLAT.Scene();
                // Each renderer owns an independent SplatData copy and Worker.
                camera = new SPLAT.Camera();
                cameraLeft = new SPLAT.Camera();
                cameraRight = new SPLAT.Camera();
                renderer = new SPLAT.WebGLRenderer(canvas, isBatchViewer ? [] : null);
                rendererRight = new SPLAT.WebGLRenderer(canvasRight, isBatchViewer ? [] : null);
                renderer._sharpBatch = rendererRight._sharpBatch = isBatchViewer;
                // WebGLRenderer sets canvas.style.background to black in its constructor.
                // Reapply the user's persisted color after both renderers exist.
                canvas.style.backgroundColor = currentBackgroundColor;
                canvasRight.style.backgroundColor = currentBackgroundColor;
                controls = new SPLAT.OrbitControls(camera, viewerContainer, 0.5, 0.5, 5, !isBatchViewer);
                // Allow twice as close as before and halve wheel zoom sensitivity.
                controls.minZoom = 0.05;
                controls.zoomSpeed = 0.5;

                // Keep the clipping range consistent across the master and both eye cameras.
                // Near is halved and far is doubled relative to gsplat.js defaults.
                const CAMERA_NEAR = 0.05;
                const CAMERA_FAR = 200.0;
                for (const eyeCamera of [camera, cameraLeft, cameraRight]) {
                    eyeCamera.data.fx = DEFAULT_FOCAL_LENGTH;
                    eyeCamera.data.fy = DEFAULT_FOCAL_LENGTH;
                    eyeCamera.data.near = CAMERA_NEAR;
                    eyeCamera.data.far = CAMERA_FAR;
                }

                // Handle resize
                const resize = () => {
                    // Only resize renderer if resolution is NOT locked
                    // If locked, the canvas resolution stays fixed (e.g. at 2K),
                    // and CSS handles the visual fitting to container.
                    if (!isResolutionLocked) {
                        const leftWidth = Math.max(1, Math.floor(leftPane.clientWidth));
                        const leftHeight = Math.max(1, Math.floor(leftPane.clientHeight));
                        renderer.setSize(leftWidth, leftHeight);
                        if (isStereoEnabled()) {
                            const rightWidth = Math.max(1, Math.floor(rightPane.clientWidth));
                            const rightHeight = Math.max(1, Math.floor(rightPane.clientHeight));
                            rendererRight.setSize(rightWidth, rightHeight);
                        }
                    }
                };
                window.addEventListener('resize', resize);
                resize();

                // Track ComfyUI node resizing without changing WebGL resolution.
                const paneResizeObserver = new ResizeObserver(() => {
                    updateCanvasDisplaySizes();
                });

                paneResizeObserver.observe(leftPane);
                paneResizeObserver.observe(rightPane);

                // Start render loop
                const frame = () => {
                    controls.update();
                    syncStereoCameras();
                    applyPendingSplatAdjustments();
                    renderer.render(scene, cameraLeft);
                    updateFocalUniform(renderer, cameraLeft);
                    if (isStereoEnabled()) {
                        rendererRight.render(sceneRight, cameraRight);
                        updateFocalUniform(rendererRight, cameraRight);
                    }
                    animationId = requestAnimationFrame(frame);
                };
                if (!isSharedWorker) frame();

                console.log('[GaussianViewer] Initialized successfully');
                if (isSharedWorker) {
                    // Rendering is job-driven, never dependent on requestAnimationFrame.
                    viewerContainer.style.pointerEvents = 'none';
                    document.getElementById('controlsBar').style.pointerEvents = 'none';
                    startSharedWorker();
                } else if (isBatchViewer) window.parent.postMessage({type:"BATCH_VIEWER_READY"}, location.origin);
            } catch (err) {
                console.error('[GaussianViewer] Init error:', err);
                showError('Failed to initialize WebGL viewer: ' + err.message);
            }
        }

        function isStereoEnabled() {
            return viewMode.checked;
        }

        function updateViewMode() {
            const mono = !isStereoEnabled();
            stereoPanes.classList.toggle('mono-mode', mono);
            // Keep stereo settings editable in Mono; they are applied on return to Stereo.
            // Resize the active renderer/canvas layout only; this does not resize the ComfyUI node.
            window.dispatchEvent(new Event('resize'));
            updateCanvasDisplaySizes();
            syncStereoCameras();
        }

        // Compute a render-only rig from the original camera each time. Never
        // mutate OrbitControls or accumulate offsets between draws/frames.
        function batchCameraView(baseCamera, baseTarget, settings) {
            const view = {position: baseCamera.position, rotation: baseCamera.rotation,
                fx: baseCamera.data.fx, fy: baseCamera.data.fy, target: baseTarget};
            if (!settings) return view;
            const dolly = settings.dolly_m ?? 0;
            const yaw = settings.orbit_yaw_deg ?? 0, pitch = settings.orbit_pitch_deg ?? 0;
            if (!dolly && !yaw && !pitch) return view;

            const V = SPLAT.Vector3;
            const Q = SPLAT.Quaternion;
            const forward = new V(0, 0, 1);
            const baseDistance = baseTarget ? baseCamera.position.distanceTo(baseTarget)
                : Math.max(1, baseCamera.position.magnitude());
            if (yaw || pitch) {
                // Fixed pivot, not the per-frame bounding box, to avoid introducing
                // additional temporal camera motion. Preserve the zero-angle pose.
                const pivotDistance = settings.mode === 'fixed' && settings.convergence_m > 0
                    ? settings.convergence_m : 1;
                const pivot = baseCamera.position.add(baseCamera.rotation.apply(forward).multiply(pivotDistance));
                const radians = Math.PI / 180;
                view.rotation = baseCamera.rotation.multiply(Q.FromEuler(new V(pitch * radians, yaw * radians, 0))).normalize();
                view.position = pivot.subtract(view.rotation.apply(forward).multiply(pivotDistance));
            }
            // Move forward along the final viewing axis.
            view.position = view.position.add(view.rotation.apply(new V(0, 0, dolly)));
            // Legacy convergence follows the transformed orbit target; fixed modes
            // instead measure convergence from the final camera position as before.
            view.target = view.position.add(view.rotation.apply(forward).multiply(Math.max(0.05, baseDistance - dolly)));
            return view;
        }

        // Synchronize both eye cameras from the shared orbit camera.
        // Parallel preserves orientation; Toe-in aims at a shared convergence point.
        function syncStereoCameras() {
            if (!camera || !cameraLeft || !cameraRight) return;

            const targetIntensity = Number(stereoSlider.value) || 0;
            const now = performance.now();
            const delta = lastStereoUpdateTime
                ? Math.min(now - lastStereoUpdateTime, 50)
                : 16.67;
            lastStereoUpdateTime = now;

            // A short exponential ease (75 ms time constant) removes stepped motion
            // without making the stereo control feel sluggish.
            const smoothing = 1 - Math.exp(-delta / 75);
            smoothedStereoIntensity +=
                (targetIntensity - smoothedStereoIntensity) * smoothing;
            if (Math.abs(targetIntensity - smoothedStereoIntensity) < 0.05) {
                smoothedStereoIntensity = targetIntensity;
            }

            const sliderValue = smoothedStereoIntensity;
            // Keep the sign: negative intensity must move each eye camera
            // through the center and continue along its own trajectory.
            const signedIntensity = sliderValue / 100;
            const mode = stereoMode.value;

            stereoValue.textContent = `${targetIntensity > 0 ? '+' : ''}${targetIntensity}%`;
            const fixedStereo = isBatchViewer && batchStereo?.mode === 'fixed';
            // Always clear any previous off-axis shift when switching to legacy/mono.
            if (!fixedStereo || !isStereoEnabled()) {
                cameraLeft.data.shiftX = cameraRight.data.shiftX = 0;
            }
            if (fixedStereo) stereoValue.textContent = `${(batchStereo.baseline_m * 1000).toFixed(0)} mm`;

            const originalTarget = controls?.getTarget?.() ?? initialCameraData?.target;
            const view = batchCameraView(camera, originalTarget, isBatchViewer ? batchStereo : null);

            if (!isStereoEnabled()) {
                // Mono uses the master camera pose directly: no stereo offset and
                // no Toe-in convergence adjustment, preserving the current view axis.
                cameraLeft.position = view.position.clone();
                cameraLeft.rotation = view.rotation.clone();
                cameraRight.position = view.position.clone();
                cameraRight.rotation = view.rotation.clone();
                for (const eyeCamera of [cameraLeft, cameraRight]) {
                    eyeCamera.data.fx = view.fx;
                    eyeCamera.data.fy = view.fy;
                    eyeCamera.data.near = camera.data.near;
                    eyeCamera.data.far = camera.data.far;
                }
                return;
            }

            const target = view.target;
            const distance = target
                ? view.position.distanceTo(target)
                : Math.max(1, view.position.magnitude());

            // Signed baseline: crossing zero makes the two eye cameras pass
            // through one another without swapping panes or canvas assignments.
            const baseline = fixedStereo ? batchStereo.baseline_m : distance * 0.12 * signedIntensity;
            const worldRight = view.rotation.apply(new SPLAT.Vector3(1, 0, 0));
            const halfOffset = worldRight.multiply(baseline * 0.5);

            // Both cameras converge on the orbit target.
            const convergenceTarget = target ?? view.position.add(
                view.rotation.apply(new SPLAT.Vector3(0, 0, 1)).multiply(distance)
            );

            const copyPose = (eyeCamera, sign) => {
                const eyePosition = view.position.add(halfOffset.multiply(sign));
                eyeCamera.position = eyePosition;

                const fixedToeIn = fixedStereo && batchStereo.projection === 'Toe-in' && batchStereo.convergence_m > 0;
                if (fixedToeIn || (!fixedStereo && mode === 'toe-in')) {
                    const toeTarget = fixedToeIn ? view.position.add(
                        view.rotation.apply(new SPLAT.Vector3(0, 0, 1)).multiply(batchStereo.convergence_m)
                    ) : convergenceTarget;
                    const direction = toeTarget.clone()
                        .subtract(eyePosition)
                        .normalize();
                    eyeCamera.rotation = SPLAT.Quaternion.LookRotation(direction);
                } else {
                    eyeCamera.rotation = view.rotation.clone();
                }

                eyeCamera.data.fx = view.fx;
                eyeCamera.data.fy = view.fy;
                eyeCamera.data.near = camera.data.near;
                eyeCamera.data.far = camera.data.far;
                // At Z=convergence_m the camera translation is canceled by
                // the principal-point shift. No toe-in or vertical disparity.
                eyeCamera.data.shiftX = fixedStereo && batchStereo.projection === 'Parallel off-axis' && batchStereo.convergence_m > 0
                    ? sign * baseline / (2 * batchStereo.convergence_m) : 0;
            };

            copyPose(cameraLeft, -1);
            copyPose(cameraRight, 1);
        }


        // gsplat.js uploads focal length as a shader uniform during initialization.
        // The original single-view code changes camera.data.fx/fy after initialization,
        // so refresh the uniform after each render when intrinsics are supplied.
        function updateFocalUniform(activeRenderer, eyeCamera) {
            if (!activeRenderer?.gl || !activeRenderer?.renderProgram?.program) return;
            const gl = activeRenderer.gl;
            const program = activeRenderer.renderProgram.program;
            gl.useProgram(program);
            if (!activeRenderer._stereoFocalLocation) {
                activeRenderer._stereoFocalLocation = gl.getUniformLocation(program, 'focal');
            }
            if (activeRenderer._stereoFocalLocation) {
                gl.uniform2fv(activeRenderer._stereoFocalLocation,
                    new Float32Array([eyeCamera.data.fx, eyeCamera.data.fy]));
            }
        }

        // Ask the ComfyUI node to adapt its height to the source image while
        // always reserving the viewer area for two side-by-side stereo panels.
        // The node width remains user-controlled and is not changed here.
        function requestNodeHeightFromStereoAspect(intrinsics) {
            if (!Array.isArray(intrinsics) || intrinsics.length < 2) return;
            const cx = Number(intrinsics[0]?.[2]);
            const cy = Number(intrinsics[1]?.[2]);
            if (!(cx > 0) || !(cy > 0)) return;

            requestAnimationFrame(() => {
                const imageWidth = cx * 2;
                const imageHeight = cy * 2;
                const sourceAspect = imageWidth / imageHeight;
                const stereoPaneHeight = viewerContainer.clientWidth / (2 * sourceAspect);
                if (!Number.isFinite(stereoPaneHeight) || stereoPaneHeight <= 0) return;

                const requestedIframeHeight = Math.ceil(stereoPaneHeight +
                    document.getElementById('controlsBar').offsetHeight);
                window.parent.postMessage({
                    type: 'VIEWER_RESIZE_REQUEST',
                    iframeHeight: requestedIframeHeight,
                    sourceAspect,
                    timestamp: Date.now()
                }, '*');
            });
        }

        // Show error
        function showError(message) {
            errorEl.textContent = message;
            errorEl.classList.remove('hidden');
        }

        // Store initial camera params for reset
        let initialCameraData = null;

        // Resolution lock state
        let isResolutionLocked = false;

        // Scale compensation: when focal length is scaled down for canvas size,
        // gaussian scales need to be multiplied by this factor to maintain correct screen-space size
        let gaussianScaleCompensation = 1.0;

        // Resume the animation loop (used after pausing for screenshot/clipboard)
        function resumeAnimationLoop() {
            const frame = () => {
                controls.update();
                syncStereoCameras();
                applyPendingSplatAdjustments();
                renderer.render(scene, cameraLeft);
                updateFocalUniform(renderer, cameraLeft);
                if (isStereoEnabled()) {
                    rendererRight.render(sceneRight, cameraRight);
                    updateFocalUniform(rendererRight, cameraRight);
                }
                animationId = requestAnimationFrame(frame);
            };
            frame();
        }

        // Set camera from extrinsics and intrinsics
        // extrinsics: 4x4 matrix (identity for SHARP = camera at origin looking down +Z)
        // intrinsics: 3x3 matrix [[fx, 0, cx], [0, fy, cy], [0, 0, 1]]
        // splat: the loaded Gaussian splat object (optional, used for bounds)
        function setCameraFromExtrinsics(extrinsics, intrinsics, splat) {
            if (!camera || !controls) return;

            console.log('[GaussianViewer] Setting camera from extrinsics/intrinsics');
            console.log('[GaussianViewer] Extrinsics:', JSON.stringify(extrinsics));
            console.log('[GaussianViewer] Intrinsics:', JSON.stringify(intrinsics));

            // Parse extrinsics to get camera position
            // For a 4x4 extrinsics matrix [R|t], camera position in world space is -R^T * t
            // But for identity matrix, camera is simply at origin
            let camPosX = 0, camPosY = 0, camPosZ = 0;

            if (extrinsics && Array.isArray(extrinsics) && extrinsics.length === 4) {
                // Extract rotation and translation from 4x4 extrinsics
                const R = [
                    [extrinsics[0][0], extrinsics[0][1], extrinsics[0][2]],
                    [extrinsics[1][0], extrinsics[1][1], extrinsics[1][2]],
                    [extrinsics[2][0], extrinsics[2][1], extrinsics[2][2]]
                ];
                const t = [extrinsics[0][3], extrinsics[1][3], extrinsics[2][3]];

                // Camera position = -R^T * t
                camPosX = -(R[0][0] * t[0] + R[1][0] * t[1] + R[2][0] * t[2]);
                camPosY = -(R[0][1] * t[0] + R[1][1] * t[1] + R[2][1] * t[2]);
                camPosZ = -(R[0][2] * t[0] + R[1][2] * t[1] + R[2][2] * t[2]);

                console.log('[GaussianViewer] Computed camera position from extrinsics:', camPosX, camPosY, camPosZ);
            }

            // Calculate FOV and set camera focal length from intrinsics
            // intrinsics[0][0] = fx (focal length in pixels)
            // intrinsics[1][1] = fy (focal length in pixels)
            // intrinsics[1][2] = cy (principal point y = image_height / 2)
            let targetZ = 2; // default
            if (intrinsics && Array.isArray(intrinsics) && intrinsics.length >= 2) {
                const fx = intrinsics[0][0];
                const fy = intrinsics[1][1];
                const cx = intrinsics[0][2];
                const cy = intrinsics[1][2];
                const imageWidth = cx * 2;  // cx is typically image_width / 2
                const imageHeight = cy * 2; // cy is typically image_height / 2

                console.log('[GaussianViewer] Intrinsics: fx=', fx, 'fy=', fy, 'cx=', cx, 'cy=', cy);
                console.log('[GaussianViewer] Image dimensions (from intrinsics):', imageWidth, 'x', imageHeight);

                // Determine if we should lock resolution to native image size
                // We lock resolution if intrinsics are provided to ensure "WYSIWYG" with high-res output
                isResolutionLocked = true;
                
                // Get current container size for scale compensation calculation
                const containerWidth = canvas.clientWidth || 512;
                const containerHeight = canvas.clientHeight || 512;

                // Lock renderer size to NATIVE image resolution
                console.log(`[GaussianViewer] Locking resolution to native: ${imageWidth}x${imageHeight}`);
                renderer.setSize(imageWidth, imageHeight);
                rendererRight.setSize(imageWidth, imageHeight);


                updateCanvasDisplaySizes();

                
                // Use NATIVE focal length (no scaling down)
                camera.data.fx = fx;
                camera.data.fy = fy;
                cameraLeft.data.fx = fx;
                cameraLeft.data.fy = fy;
                cameraRight.data.fx = fx;
                cameraRight.data.fy = fy;

                // IMPORTANT: Calculate scale compensation
                // gsplat.js renders points based on their world space size projected to screen space.
                // When we view a 2048x2048 image in a 512x512 container, we are effectively zooming out.
                // To make the points appear as "solid" as they do in the original training view,
                // we need to compensate for this difference.
                
                // Empirical observation suggests we need a stronger compensation than just the ratio.
                // If user says Scale ~14 is good when ratio is ~4 (2048/512), then compensation might be squared ratio?
                // Or maybe the points from this trainer are just naturally small.
                // Let's stick to linear ratio for now but allow a base multiplier.
                
                // For now, let's trust the ratio but maybe add a boost factor if needed.
                // User reported needing ~14x scale. If image is 2048 and container 512, ratio is 4.
                // 14 / 4 = 3.5. So maybe there's an inherent factor of 3-4 missing?
                // Actually, let's just apply the ratio logic strictly first:
                // If I render at 2048px width, a point of size 1 world unit covers X pixels.
                // If I render at 512px width, it covers X/4 pixels.
                // But visually, if I look at the 2048px image scaled down to 512px on my screen (via CSS),
                // the point covers X pixels of the *buffer*, which is X/4 pixels on *screen*.
                // Wait, if we render at high res, the points are physically "correct" size in pixels for that resolution.
                // The issue is likely that "correct" size is often too sparse for point clouds that rely on splatting overlap.
                
                // Let's use the ratio, but ensure we aren't double counting.
                gaussianScaleCompensation = imageWidth / containerWidth;
                
                // Add an extra boost because often raw splats are too small without the "dilation" effect of low-res rendering
                // When you render low-res, rasterization snaps to pixels, effectively making small points relatively larger.
                // High-res rendering loses this "free aliasing coverage".
                // Let's add a heuristic boost factor.
                // User said 14x was good. 14 / (2048/512) = 3.5.
                // Let's try boosting the compensation significantly.
                // gaussianScaleCompensation *= 3.0; // Boost factor
                
                // Actually, let's change how we calculate this.
                // If the user wants "WYSIWYG" relative to the preview size:
                // We want the point to cover the same *percentage* of the screen width.
                // PointRadius / ImageWidth = Constant.
                // If we increase ImageWidth by factor S, PointRadius must increase by factor S.
                // This is what gaussianScaleCompensation = imageWidth / containerWidth does.
                
                // However, the user reports it's still sparse. This implies the *base* size is too small.
                // Maybe the "preview" logic in other viewers implicitly boosts size?
                // Or maybe the training output relies on a specific focal length?
                
                // Let's force a minimum compensation to avoid sparsity.
                // And let's default the UI scale slider to something higher if we detect high-res?
                // No, better to fix the compensation calculation.
                
                // Let's try applying a stronger multiplier.
                // If resolution is locked, we are in "High Res Mode".
                // Let's scale up by the ratio AND a bit more.
                gaussianScaleCompensation = (imageWidth / containerWidth) * 3.0; // 3.0 is a heuristic "density boost"

                console.log('[GaussianViewer] Native resolution:', imageWidth, 'x', imageHeight);
                console.log('[GaussianViewer] Container size:', containerWidth, 'x', containerHeight);
                console.log('[GaussianViewer] Gaussian scale compensation (with 3x boost):', gaussianScaleCompensation.toFixed(2), 'x');

                // Calculate vertical FOV in radians for logging
                const fovY = 2 * Math.atan(imageHeight / (2 * fy));
                const fovYDeg = fovY * 180 / Math.PI;
                console.log('[GaussianViewer] Calculated FOV:', fovYDeg, 'degrees');

                // For SHARP, the scene is in front of the camera
                // Use focal length to estimate a reasonable target distance
                // The disparity range in metadata can help estimate scene depth
                // For now, use a simple heuristic based on typical SHARP output
                targetZ = Math.max(1, fy / imageHeight * 2);
                console.log('[GaussianViewer] Target Z distance:', targetZ);
            }

            // Determine the target position (what the camera looks at)
            // For the INITIAL view (matching original image), look STRAIGHT AHEAD along Z axis
            // NOT at the scene center - that would tilt the camera
            let targetX = 0, targetY = 0;
            let orbitZ = targetZ;  // For orbiting, use a closer point
            if (splat && splat.bounds) {
                const center = splat.bounds.center();
                const size = splat.bounds.size();

                // Use scene center Z for the view direction
                targetZ = center.z;

                // For orbit center, use distance to closest object + 50%
                // Camera is at origin, so minZ is the distance to closest point
                const minZ = center.z - size.z / 2;
                orbitZ = minZ * 1.5;  // 50% past the closest point

                console.log('[GaussianViewer] Scene center:', center.x, -center.y, center.z);
                console.log('[GaussianViewer] Closest point Z:', minZ.toFixed(1));
                console.log('[GaussianViewer] Orbit center Z:', orbitZ.toFixed(1), '(closest + 50%)');
            }

            // SHARP uses Y-down coordinate system, so flip camera Y as well
            camPosY = -camPosY;

            // For SHARP: camera is at origin, scene is at positive Z
            // The orbit controls work by having the camera orbit around a target point.
            // To get the "original image view", we set camera at the computed position
            // and look at the scene center.

            const camPos = new SPLAT.Vector3(camPosX, camPosY, camPosZ);
            // Use orbitZ for the target - closer to camera for better orbit feel
            const targetPos = new SPLAT.Vector3(targetX, targetY, orbitZ);

            // Store for reset
            initialCameraData = {
                position: camPos,
                target: targetPos,
                fx: camera.data.fx,
                fy: camera.data.fy
            };

            // Set camera position - IMPORTANT: must set camera.position, not camera.data.position
            // camera.position is used by OrbitControls
            // camera.data.position is used for rendering
            camera.position.x = camPosX;
            camera.position.y = camPosY;
            camera.position.z = camPosZ;

            // Update orbit controls to orbit around the target point
            // This recalculates the internal orbit state from current camera.position
            controls.setCameraTarget(targetPos);

            console.log('[GaussianViewer] Camera set to position:', camPosX, camPosY, camPosZ);
            console.log('[GaussianViewer] Looking at target:', targetX, targetY, targetZ);
            console.log('[GaussianViewer] This should match the original input image view');
        }

        // Load a PLY file from ArrayBuffer data
        async function loadPLYFromData(arrayBuffer, filename, extrinsics, intrinsics) {
            try {
                // Reset per-model adjustment snapshots.
                originalPositions = null;
                originalPositionsRight = null;
                originalScales = null;
                originalScalesRight = null;
                originalRotations = null;
                originalRotationsRight = null;
                currentSplat = null;
                currentSplatRight = null;
                pendingLeftAdjustment = false;
                pendingRightAdjustment = false;
                if (depthScaleDebounceTimer !== null) {
                    clearTimeout(depthScaleDebounceTimer);
                    depthScaleDebounceTimer = null;
                }
                depthScaleCameraOrigin = null;
                // Reset lock state
                isResolutionLocked = false;
                
                // Clear ALL existing objects from scene
                if (scene.objects && scene.objects.length > 0) {
                    while (scene.objects.length > 0) scene.removeObject(scene.objects[0]);
                }
                if (sceneRight.objects && sceneRight.objects.length > 0) {
                    while (sceneRight.objects.length > 0) sceneRight.removeObject(sceneRight.objects[0]);
                }

                // Pre-calculate scale compensation from intrinsics BEFORE loading
                // This ensures gaussian scales are correct from the start
                gaussianScaleCompensation = 1.0;  // Default if no intrinsics
                if (intrinsics && Array.isArray(intrinsics) && intrinsics.length >= 2) {
                    const cx = intrinsics[0][2];
                    const imageWidth = cx * 2;
                    const containerWidth = canvas.clientWidth || 512;
                    
                    // Base compensation: Ratio of Native / Display
                    let ratio = imageWidth / containerWidth;
                    
                    // Heuristic: Add a "Density Boost" for high-res rendering.
                    // High-res rendering tends to make points look sparse because they don't overlap as much
                    // as they do in lower resolutions (due to sub-pixel vs pixel rasterization effects).
                    // We multiply by an extra factor to simulate the "fullness" of a lower-res view.
                    // Based on user feedback, a factor of ~10.0 (total) is often needed for ideal density.
                    const DENSITY_BOOST = 10.0;
                    
                    gaussianScaleCompensation = ratio * DENSITY_BOOST;
                    
                    console.log('[GaussianViewer] Pre-calculated scale compensation:', gaussianScaleCompensation.toFixed(2), 'x');
                    console.log('[GaussianViewer] Ratio:', ratio.toFixed(2), 'Density Boost:', DENSITY_BOOST);
                    console.log('[GaussianViewer] (Image:', imageWidth, 'px / Container:', containerWidth, 'px)');
                }

                console.log('[GaussianViewer] Loading from data, size:', arrayBuffer.byteLength);

                // Create a blob URL from the data
                const blob = new Blob([arrayBuffer], { type: 'application/octet-stream' });
                const blobUrl = URL.createObjectURL(blob);

                // Load the PLY file from blob URL using PLYLoader
                await SPLAT.PLYLoader.LoadAsync(blobUrl, scene);

                // Clean up blob URL
                URL.revokeObjectURL(blobUrl);

                // Get the loaded splat (last object in scene)
                if (scene.objects && scene.objects.length > 0) {
                    currentSplat = scene.objects[scene.objects.length - 1];
                    currentSplatRight = currentSplat.clone();
                    sceneRight.addObject(currentSplatRight);

                    // Log bounds info for debugging
                    if (currentSplat.bounds) {
                        const center = currentSplat.bounds.center();
                        const size = currentSplat.bounds.size();
                        console.log('[GaussianViewer] Scene bounds center:', center.x, center.y, center.z);
                        console.log('[GaussianViewer] Scene bounds size:', size.x, size.y, size.z);
                    }

                    // Keep the original Gaussian centers for repeatable, non-cumulative transforms.
                    originalPositions = getSplatPositionArray(currentSplat);
                    if (originalPositions) {
                        originalPositions = new Float32Array(originalPositions);
                    }
                    const rightPositions = getSplatPositionArray(currentSplatRight);
                    originalPositionsRight = rightPositions ? new Float32Array(rightPositions) : null;
                    originalRotations = currentSplat.data?.rotations
                        ? new Float32Array(currentSplat.data.rotations) : null;
                    originalRotationsRight = currentSplatRight.data?.rotations
                        ? new Float32Array(currentSplatRight.data.rotations) : null;

                    // Store original scales and log statistics
                    if (currentSplat.data && currentSplat.data.scales) {
                        const scales = currentSplat.data.scales;
                        const numGaussians = scales.length / 3;
                        let minScale = Infinity, maxScale = -Infinity, sumScale = 0;

                        // Store a copy of original scales (BEFORE compensation) for dynamic adjustment
                        // The stored scales include the compensation factor so user scale=1 shows correct size
                        originalScales = new Float32Array(scales.length);
                        const rightScales = currentSplatRight.data.scales;
                        originalScalesRight = new Float32Array(rightScales.length);
                        for (let i = 0; i < scales.length; i++) {
                            // Apply compensation: gaussians need to be larger when focal length is scaled down.
                            originalScales[i] = scales[i] * gaussianScaleCompensation;
                            originalScalesRight[i] = rightScales[i] * gaussianScaleCompensation;
                        }
                        console.log('[GaussianViewer] Stored compensated scales (factor:', gaussianScaleCompensation.toFixed(2), 'x)');

                        // Apply compensated scales immediately
                        for (let i = 0; i < scales.length; i++) {
                            scales[i] = originalScales[i];
                            rightScales[i] = originalScalesRight[i];
                        }

                        // Mark both independent datasets as changed.
                        currentSplat.data.changed = true;
                        currentSplatRight.data.changed = true;

                        for (let i = 0; i < scales.length; i++) {
                            const s = scales[i];
                            minScale = Math.min(minScale, s);
                            maxScale = Math.max(maxScale, s);
                            sumScale += s;
                        }

                        const avgScale = sumScale / scales.length;
                        console.log('[GaussianViewer] === GAUSSIAN SCALE DEBUG (after compensation) ===');
                        console.log('[GaussianViewer] Number of Gaussians:', numGaussians);
                        console.log('[GaussianViewer] Compensated scale min:', minScale.toFixed(6));
                        console.log('[GaussianViewer] Compensated scale max:', maxScale.toFixed(6));
                        console.log('[GaussianViewer] Compensated scale avg:', avgScale.toFixed(6));
                        console.log('[GaussianViewer] =================================================');
                    } else {
                        console.log('[GaussianViewer] No scales data found on splat object');
                        console.log('[GaussianViewer] Splat properties:', Object.keys(currentSplat));
                        if (currentSplat.data) {
                            console.log('[GaussianViewer] Splat.data properties:', Object.keys(currentSplat.data));
                        }
                        originalScales = null;
                        originalScalesRight = null;
                    }

                    // Reset viewer adjustments when loading a new splat.
                    scaleInput.value = 1.0;
                    currentScale = 1.0;
                    depthScaleInput.value = 1.0;
                    currentDepthScale = 1.0;
                    depthScaleValue.textContent = '1.00×';
                }

                // Set camera from extrinsics and intrinsics if provided
                if (extrinsics || intrinsics) {
                    setCameraFromExtrinsics(extrinsics, intrinsics, currentSplat);
                    if (controls) controls.update();
                }
                initializeDepthScaleAxis(currentSplat);
                requestNodeHeightFromStereoAspect(intrinsics);

                // Notify parent
                window.parent.postMessage({
                    type: 'MESH_LOADED',
                    error: null,
                    timestamp: Date.now()
                }, '*');

                console.log('[GaussianViewer] Loaded successfully');

            } catch (err) {
                console.error('[GaussianViewer] Load error:', err);
                showError('Failed to load PLY: ' + err.message);

                window.parent.postMessage({
                    type: 'MESH_ERROR',
                    error: err.message,
                    timestamp: Date.now()
                }, '*');
            }
        }

        async function loadPLYFromURL(url, filename, extrinsics, intrinsics, batch = false, detail = {}, fastNeutral = false) {
            try {
                // Reset per-model adjustment snapshots.
                originalPositions = null;
                originalPositionsRight = null;
                originalScales = null;
                originalScalesRight = null;
                originalRotations = null;
                originalRotationsRight = null;
                currentSplat = null;
                currentSplatRight = null;
                pendingLeftAdjustment = false;
                pendingRightAdjustment = false;
                if (depthScaleDebounceTimer !== null) {
                    clearTimeout(depthScaleDebounceTimer);
                    depthScaleDebounceTimer = null;
                }
                depthScaleCameraOrigin = null;
                // Reset lock state
                isResolutionLocked = false;

                // Fast batches replace old splats atomically after decoding.
                if (!fastNeutral) {
                    scene._sharpBatchFast = sceneRight._sharpBatchFast = false;
                    while (scene.objects.length > 0) scene.removeObject(scene.objects[0]);
                    while (sceneRight.objects.length > 0) sceneRight.removeObject(sceneRight.objects[0]);
                }

                // Pre-calculate scale compensation from intrinsics BEFORE loading
                gaussianScaleCompensation = 1.0;
                if (intrinsics && Array.isArray(intrinsics) && intrinsics.length >= 2) {
                    const cx = intrinsics[0][2];
                    const imageWidth = cx * 2;
                    const containerWidth = canvas.clientWidth * 2 || 512;
                    let ratio = imageWidth / containerWidth;
                    const DENSITY_BOOST = 10.0;
                    gaussianScaleCompensation = ratio * DENSITY_BOOST;
                    console.log('[GaussianViewer] Pre-calculated scale compensation:', gaussianScaleCompensation.toFixed(2), 'x');
                }

                console.log('[GaussianViewer] Loading from URL:', url);

                // Load PLY directly from URL — gsplat.js streams it
                if (fastNeutral) {
                    const pair = await SPLAT.PLYLoader.LoadSharpBatchPairAsync(url, detail);
                    currentSplat = pair.left; currentSplatRight = pair.right;
                    if (pair.shared) {
                        scene.replaceSharpBatchObject(currentSplat);
                        sceneRight.replaceSharpBatchObject(currentSplatRight);
                        detail.shared=1;
                    } else {
                        scene._sharpBatchFast = sceneRight._sharpBatchFast = false;
                        while (scene.objects.length) scene.removeObject(scene.objects[0]);
                        while (sceneRight.objects.length) sceneRight.removeObject(sceneRight.objects[0]);
                        scene.addObject(currentSplat); sceneRight.addObject(currentSplatRight);
                        detail.shared=0;
                    }
                } else if (batch && isSharedWorker && typeof SPLAT.PLYLoader.LoadSharpBatchAsync === 'function') {
                    await SPLAT.PLYLoader.LoadSharpBatchAsync(url, scene, detail);
                } else {
                    await SPLAT.PLYLoader.LoadAsync(url, scene);
                }

                // Get the loaded splat (last object in scene)
                if (scene.objects && scene.objects.length > 0) {
                    currentSplat = scene.objects[scene.objects.length - 1];
                    if (!fastNeutral) {
                        currentSplatRight = currentSplat.clone();
                        sceneRight.addObject(currentSplatRight);
                    }

                    if (currentSplat.bounds) {
                        const center = currentSplat.bounds.center();
                        const size = currentSplat.bounds.size();
                        console.log('[GaussianViewer] Scene bounds center:', center.x, center.y, center.z);
                        console.log('[GaussianViewer] Scene bounds size:', size.x, size.y, size.z);
                    }

                    // Keep original Gaussian centers for repeatable, non-cumulative transforms.
                    originalPositions = getSplatPositionArray(currentSplat);
                    if (originalPositions) {
                        originalPositions = new Float32Array(originalPositions);
                    }
                    const rightPositions = getSplatPositionArray(currentSplatRight);
                    originalPositionsRight = detail.shared ? originalPositions : (rightPositions ? new Float32Array(rightPositions) : null);
                    originalRotations = currentSplat.data?.rotations
                        ? new Float32Array(currentSplat.data.rotations) : null;
                    originalRotationsRight = detail.shared ? originalRotations : (currentSplatRight.data?.rotations
                        ? new Float32Array(currentSplatRight.data.rotations) : null);

                    // Store original scales and apply compensation
                    if (currentSplat.data && currentSplat.data.scales) {
                        const scales = currentSplat.data.scales;
                        const numGaussians = scales.length / 3;

                        originalScales = new Float32Array(scales);
                        const rightScales = currentSplatRight.data.scales;
                        originalScalesRight = detail.shared ? originalScales : new Float32Array(rightScales);
                        if (!detail.shared) {
                            currentSplat.data.changed = true;
                            currentSplatRight.data.changed = true;
                        }

                        console.log('[GaussianViewer] Applied scale compensation:', gaussianScaleCompensation.toFixed(2), 'x,', numGaussians, 'gaussians');
                    } else {
                        originalScales = null;
                        originalScalesRight = null;
                    }

                    scaleInput.value = 1.0;
                    currentScale = 1.0;
                    depthScaleInput.value = 1.0;
                    currentDepthScale = 1.0;
                    depthScaleValue.textContent = '1.00×';
                }

                // Set camera from extrinsics and intrinsics if provided
                if (extrinsics || intrinsics) {
                    setCameraFromExtrinsics(extrinsics, intrinsics, currentSplat);
                    if (controls) controls.update();
                }
                initializeDepthScaleAxis(currentSplat);
                requestNodeHeightFromStereoAspect(intrinsics);

                window.parent.postMessage({
                    type: 'MESH_LOADED',
                    error: null,
                    timestamp: Date.now()
                }, '*');

                console.log('[GaussianViewer] Loaded successfully from URL');
                if (batch && (!currentSplat || !currentSplatRight)) throw new Error('PLY contains no splats');

            } catch (err) {
                console.error('[GaussianViewer] Load error:', err);
                showError('Failed to load PLY: ' + err.message);
                if (batch) throw err;

                window.parent.postMessage({
                    type: 'MESH_ERROR',
                    error: err.message,
                    timestamp: Date.now()
                }, '*');
            }
        }

        // Smoothly reset camera to its initial position.
        function resetCamera() {
            if (!camera || !controls) return;

            // Cancel an unfinished reset if the button is pressed again.
            if (resetAnimationId !== null) {
                cancelAnimationFrame(resetAnimationId);
                resetAnimationId = null;
            }

            if (!initialCameraData || !initialCameraData.target) {
                camera.position.x = 0;
                camera.position.y = 0;
                camera.position.z = 5;
                controls.update();
                return;
            }

            const duration = 900;
            const startTime = performance.now();

            const startPosition = camera.position.clone();
            const endPosition = initialCameraData.position.clone();
            const endTarget = initialCameraData.target.clone();

            // Estimate the current orbit target from the viewing direction.
            const radius = camera.position.distanceTo(endTarget);
            const forward = camera.rotation.apply(new SPLAT.Vector3(0, 0, 1));
            const startTarget = camera.position.add(forward.multiply(radius));

            // Restore focal lengths.
            if (initialCameraData.fx) {
                camera.data.fx = initialCameraData.fx;
            }
            if (initialCameraData.fy) {
                camera.data.fy = initialCameraData.fy;
            }

            const animate = (now) => {
                const rawT = Math.min((now - startTime) / duration, 1);

                // Ease in-out cubic.
                const t = rawT < 0.5
                    ? 4 * rawT * rawT * rawT
                    : 1 - Math.pow(-2 * rawT + 2, 3) / 2;

                const position = new SPLAT.Vector3(
                    startPosition.x + (endPosition.x - startPosition.x) * t,
                    startPosition.y + (endPosition.y - startPosition.y) * t,
                    startPosition.z + (endPosition.z - startPosition.z) * t
                );

                const target = new SPLAT.Vector3(
                    startTarget.x + (endTarget.x - startTarget.x) * t,
                    startTarget.y + (endTarget.y - startTarget.y) * t,
                    startTarget.z + (endTarget.z - startTarget.z) * t
                );

                camera.position = position;
                controls.setCameraTarget(target);
                controls.update();

                if (rawT < 1) {
                    resetAnimationId = requestAnimationFrame(animate);
                } else {
                    resetAnimationId = null;
                    console.log('[GaussianViewer] Smooth camera reset completed');
                }
            };

            resetAnimationId = requestAnimationFrame(animate);
        }

        // Composite the transparent Gaussian render over the selected background color.
        // This keeps exported screenshots and clipboard images consistent with the viewer.
        function getCanvasWithBackground(sourceCanvas) {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = sourceCanvas.width;
            tempCanvas.height = sourceCanvas.height;
            const ctx = tempCanvas.getContext('2d');
            
            // Fill the transparent regions with the selected background color first.
            ctx.fillStyle = currentBackgroundColor;
            ctx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
            
            // Draw original canvas on top
            ctx.drawImage(sourceCanvas, 0, 0);
            
            return tempCanvas;
        }

        // Build the current output image: one canvas in mono, side-by-side in stereo.
        function composeStereoCanvas(first = null) {
            if (!isStereoEnabled()) return getCanvasWithBackground(canvas);
            const ordered = first ? [first, first === canvas ? canvasRight : canvas] :
                [canvas, canvasRight];
            const width = ordered[0].width + ordered[1].width;
            const height = Math.max(ordered[0].height, ordered[1].height);
            const output = document.createElement('canvas');
            output.width = width;
            output.height = height;
            const ctx = output.getContext('2d');
            ctx.fillStyle = currentBackgroundColor;
            ctx.fillRect(0, 0, width, height);
            ctx.drawImage(ordered[0], 0, 0);
            ctx.drawImage(ordered[1], ordered[0].width, 0);
            return output;
        }

        function renderStereoNow() {
            if (animationId) cancelAnimationFrame(animationId);
            controls.update();
            syncStereoCameras();
            applyPendingSplatAdjustments();
            renderer.render(scene, cameraLeft);
            updateFocalUniform(renderer, cameraLeft);
            if (isStereoEnabled()) {
                rendererRight.render(sceneRight, cameraRight);
                updateFocalUniform(rendererRight, cameraRight);
            }
        }

        // Save the current mono view or stereo pair through the existing ComfyUI upload path.
        async function takeScreenshot() {
            if (!renderer || (isStereoEnabled() && !rendererRight)) return;
            try {
                renderStereoNow();
                const finalCanvas = composeStereoCanvas();
                const dataUrl = finalCanvas.toDataURL('image/png');
                window.parent.postMessage({
                    type: 'SCREENSHOT',
                    image: dataUrl,
                    timestamp: Date.now()
                }, '*');
                resumeAnimationLoop();
                console.log('[GaussianViewer] View captured:', finalCanvas.width, 'x', finalCanvas.height);
            } catch (err) {
                console.error('[GaussianViewer] Screenshot error:', err);
                resumeAnimationLoop();
            }
        }

        async function copyCanvasToClipboard(sourceCanvas, label) {
            try {
                const finalCanvas = getCanvasWithBackground(sourceCanvas);
                const blob = await canvasToBlob(finalCanvas);
                await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
                window.parent.postMessage({ type: 'COPY_IMAGE', success: true, label, timestamp: Date.now() }, '*');
            } catch (err) {
                console.error('[GaussianViewer] Clipboard write failed:', err);
                window.parent.postMessage({ type: 'COPY_IMAGE', success: false, label, error: err.message, timestamp: Date.now() }, '*');
            }
        }

        async function copyImageToClipboard() {
            if (!renderer || (isStereoEnabled() && !rendererRight)) return;
            try {
                renderStereoNow();
                const pairCanvas = composeStereoCanvas();
                await copyCanvasToClipboard(pairCanvas, isStereoEnabled() ? 'stereo-pair' : 'mono-view');
            } catch (err) {
                window.parent.postMessage({ type: 'COPY_IMAGE', success: false, error: err.message, timestamp: Date.now() }, '*');
            } finally {
                resumeAnimationLoop();
            }
        }

        // Helper function to convert canvas to blob
        function canvasToBlob(canvas) {
            return new Promise((resolve, reject) => {
                canvas.toBlob(blob => {
                    if (blob) {
                        resolve(blob);
                    } else {
                        reject(new Error('Canvas toBlob failed'));
                    }
                }, 'image/png');
            });
        }

        // Gaussian depth and size controls.
        const depthScaleInput = document.getElementById('depthScaleSlider');
        const depthScaleValue = document.getElementById('depthScaleValue');
        const scaleInput = document.getElementById('gaussianScaleValue');

        function getSplatPositionArray(splat) {
            if (!splat || !splat.data) return null;
            const data = splat.data;
            for (const key of ['position', 'positions', 'means', 'center', 'centers']) {
                const value = data[key];
                if (value && ArrayBuffer.isView(value) && value.length % 3 === 0) {
                    return value;
                }
            }
            return null;
        }

        let currentScale = 1.0;
        let pendingLeftAdjustment = false;
        let pendingRightAdjustment = false;

        // Freeze the initial camera position as the pivot for radial depth scaling.
        // Orbiting the camera later must not move this origin.
        function initializeDepthScaleAxis(splat) {
            if (!splat?.bounds || !camera) {
                depthScaleCameraOrigin = null;
                console.warn('[GaussianViewer] Depth Scale pivot unavailable: scene bounds or camera missing');
                return;
            }
            const initialCamera = camera.position;
            depthScaleCameraOrigin = [initialCamera.x, initialCamera.y, initialCamera.z];
            console.log('[GaussianViewer] Radial Depth Scale pivot:', depthScaleCameraOrigin);
        }

        // Scratch buffers are reused for every Gaussian to avoid millions of
        // short-lived arrays while dragging the depth slider.
        const covarianceScratch = new Float64Array(9);
        const eigenvectorsScratch = new Float64Array(9);

        function symmetricEigen3InPlace(a, v) {
            v[0] = 1; v[1] = 0; v[2] = 0;
            v[3] = 0; v[4] = 1; v[5] = 0;
            v[6] = 0; v[7] = 0; v[8] = 1;

            for (let iteration = 0; iteration < 12; iteration++) {
                let p = 0, q = 1;
                let largest = Math.abs(a[1]);
                if (Math.abs(a[2]) > largest) { p = 0; q = 2; largest = Math.abs(a[2]); }
                if (Math.abs(a[5]) > largest) { p = 1; q = 2; largest = Math.abs(a[5]); }
                if (largest < 1e-14) break;

                const app = a[p * 3 + p];
                const aqq = a[q * 3 + q];
                const apq = a[p * 3 + q];
                const tau = (aqq - app) / (2 * apq);
                const t = (tau >= 0 ? 1 : -1) / (Math.abs(tau) + Math.sqrt(1 + tau * tau));
                const c = 1 / Math.sqrt(1 + t * t);
                const sn = t * c;

                a[p * 3 + p] = app - t * apq;
                a[q * 3 + q] = aqq + t * apq;
                a[p * 3 + q] = 0;
                a[q * 3 + p] = 0;

                for (let k = 0; k < 3; k++) {
                    if (k === p || k === q) continue;
                    const akp = a[k * 3 + p];
                    const akq = a[k * 3 + q];
                    const nextKp = c * akp - sn * akq;
                    const nextKq = sn * akp + c * akq;
                    a[k * 3 + p] = a[p * 3 + k] = nextKp;
                    a[k * 3 + q] = a[q * 3 + k] = nextKq;
                }
                for (let k = 0; k < 3; k++) {
                    const vkp = v[k * 3 + p];
                    const vkq = v[k * 3 + q];
                    v[k * 3 + p] = c * vkp - sn * vkq;
                    v[k * 3 + q] = sn * vkp + c * vkq;
                }
            }
        }

        function writeQuaternionFromMatrix(m, out, offset) {
            const trace = m[0] + m[4] + m[8];
            let w, x, y, z;
            if (trace > 0) {
                const s = Math.sqrt(trace + 1) * 2;
                w = 0.25 * s;
                x = (m[7] - m[5]) / s;
                y = (m[2] - m[6]) / s;
                z = (m[3] - m[1]) / s;
            } else if (m[0] > m[4] && m[0] > m[8]) {
                const s = Math.sqrt(1 + m[0] - m[4] - m[8]) * 2;
                w = (m[7] - m[5]) / s;
                x = 0.25 * s;
                y = (m[1] + m[3]) / s;
                z = (m[2] + m[6]) / s;
            } else if (m[4] > m[8]) {
                const s = Math.sqrt(1 + m[4] - m[0] - m[8]) * 2;
                w = (m[2] - m[6]) / s;
                x = (m[1] + m[3]) / s;
                y = 0.25 * s;
                z = (m[5] + m[7]) / s;
            } else {
                const s = Math.sqrt(1 + m[8] - m[0] - m[4]) * 2;
                w = (m[3] - m[1]) / s;
                x = (m[2] + m[6]) / s;
                y = (m[5] + m[7]) / s;
                z = 0.25 * s;
            }
            const norm = Math.hypot(w, x, y, z) || 1;
            out[offset] = w / norm;
            out[offset + 1] = x / norm;
            out[offset + 2] = y / norm;
            out[offset + 3] = z / norm;
        }

        function transformGaussianCovariance(baseScales, baseRotations, index, axis, depthFactor, scaleFactor, outScales, outRotations) {
            const si = index * 3;
            const qi = index * 4;

            // Radial scaling is isotropic: Sigma' = s^2 * Sigma.
            // Eigenvectors (and therefore the Gaussian rotation) remain unchanged.
            if (axis === null) {
                const factor = Math.abs(depthFactor) * scaleFactor;
                outScales[si] = baseScales[si] * factor;
                outScales[si + 1] = baseScales[si + 1] * factor;
                outScales[si + 2] = baseScales[si + 2] * factor;
                if (baseRotations) {
                    outRotations[qi] = baseRotations[qi];
                    outRotations[qi + 1] = baseRotations[qi + 1];
                    outRotations[qi + 2] = baseRotations[qi + 2];
                    outRotations[qi + 3] = baseRotations[qi + 3];
                } else {
                    outRotations[qi] = 1;
                    outRotations[qi + 1] = 0;
                    outRotations[qi + 2] = 0;
                    outRotations[qi + 3] = 0;
                }
                return;
            }

            let w = 1, x = 0, y = 0, z = 0;
            if (baseRotations) {
                w = baseRotations[qi]; x = baseRotations[qi + 1];
                y = baseRotations[qi + 2]; z = baseRotations[qi + 3];
                const qn = Math.hypot(w, x, y, z) || 1;
                w /= qn; x /= qn; y /= qn; z /= qn;
            }

            const r00 = 1 - 2 * (y * y + z * z);
            const r01 = 2 * (x * y - z * w);
            const r02 = 2 * (x * z + y * w);
            const r10 = 2 * (x * y + z * w);
            const r11 = 1 - 2 * (x * x + z * z);
            const r12 = 2 * (y * z - x * w);
            const r20 = 2 * (x * z - y * w);
            const r21 = 2 * (y * z + x * w);
            const r22 = 1 - 2 * (x * x + y * y);

            const sx2 = baseScales[si] ** 2;
            const sy2 = baseScales[si + 1] ** 2;
            const sz2 = baseScales[si + 2] ** 2;

            // Original covariance Sigma = R * diag(scale^2) * R^T.
            const s00 = r00 * r00 * sx2 + r01 * r01 * sy2 + r02 * r02 * sz2;
            const s01 = r00 * r10 * sx2 + r01 * r11 * sy2 + r02 * r12 * sz2;
            const s02 = r00 * r20 * sx2 + r01 * r21 * sy2 + r02 * r22 * sz2;
            const s11 = r10 * r10 * sx2 + r11 * r11 * sy2 + r12 * r12 * sz2;
            const s12 = r10 * r20 * sx2 + r11 * r21 * sy2 + r12 * r22 * sz2;
            const s22 = r20 * r20 * sx2 + r21 * r21 * sy2 + r22 * r22 * sz2;

            const dx = axis[0], dy = axis[1], dz = axis[2];
            const k = depthFactor - 1;
            const a00 = 1 + k * dx * dx, a01 = k * dx * dy, a02 = k * dx * dz;
            const a11 = 1 + k * dy * dy, a12 = k * dy * dz, a22 = 1 + k * dz * dz;

            // First multiply A*Sigma, then by A again (A is symmetric).
            const t00 = a00 * s00 + a01 * s01 + a02 * s02;
            const t01 = a00 * s01 + a01 * s11 + a02 * s12;
            const t02 = a00 * s02 + a01 * s12 + a02 * s22;
            const t10 = a01 * s00 + a11 * s01 + a12 * s02;
            const t11 = a01 * s01 + a11 * s11 + a12 * s12;
            const t12 = a01 * s02 + a11 * s12 + a12 * s22;
            const t20 = a02 * s00 + a12 * s01 + a22 * s02;
            const t21 = a02 * s01 + a12 * s11 + a22 * s12;
            const t22 = a02 * s02 + a12 * s12 + a22 * s22;

            const m = covarianceScratch;
            m[0] = t00 * a00 + t01 * a01 + t02 * a02;
            m[1] = t00 * a01 + t01 * a11 + t02 * a12;
            m[2] = t00 * a02 + t01 * a12 + t02 * a22;
            m[3] = t10 * a00 + t11 * a01 + t12 * a02;
            m[4] = t10 * a01 + t11 * a11 + t12 * a12;
            m[5] = t10 * a02 + t11 * a12 + t12 * a22;
            m[6] = t20 * a00 + t21 * a01 + t22 * a02;
            m[7] = t20 * a01 + t21 * a11 + t22 * a12;
            m[8] = t20 * a02 + t21 * a12 + t22 * a22;

            const v = eigenvectorsScratch;
            symmetricEigen3InPlace(m, v);

            // Keep the eigenvectors right-handed; flipping one column leaves
            // the represented covariance unchanged.
            const det =
                v[0] * (v[4] * v[8] - v[5] * v[7]) -
                v[1] * (v[3] * v[8] - v[5] * v[6]) +
                v[2] * (v[3] * v[7] - v[4] * v[6]);
            if (det < 0) {
                v[2] *= -1; v[5] *= -1; v[8] *= -1;
            }

            outScales[si] = Math.sqrt(Math.max(1e-16, m[0])) * scaleFactor;
            outScales[si + 1] = Math.sqrt(Math.max(1e-16, m[4])) * scaleFactor;
            outScales[si + 2] = Math.sqrt(Math.max(1e-16, m[8])) * scaleFactor;
            writeQuaternionFromMatrix(v, outRotations, qi);
        }

        // Each renderer owns a separate SplatData instance. Never write into a
        // dataset while its RenderData worker has transferred (detached) buffers.
        function applyAdjustmentToSplat(splat, basePositions, baseScales, baseRotations, renderData) {
